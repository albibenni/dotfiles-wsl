# Added only when the key is absent from your global mise config.
[tools]
node = "lts"
"npm:typescript" = "6"
"npm:typescript-language-server" = "latest"
"npm:bash-language-server" = "latest"
"npm:pyright" = "latest"
"npm:prettier" = "latest"

# Editor helpers; Treesitter master supports the 0.25 CLI series.
"tree-sitter" = "0.25"
lua-language-server = "latest"
stylua = "latest"
lazygit = "latest"

# Java 25 runs JDTLS; projects can choose their own Java version.
pnpm = "latest"
java = "temurin-25"
maven = "latest"
