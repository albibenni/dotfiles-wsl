# Hyprland/Omarchy port for Windows 11, GlazeWM 3.10.1.
# Win+L stays Windows lock; use Alt+L or Win+Right. No registry remapping.
# Hyprland gaps_in=4 on each side becomes an 8px inter-window gap.
# The installer substitutes {{WSL_DISTRO}} with the selected WSL distro.
general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: monitor_focus
  hide_method: cloak
  show_all_in_taskbar: false
gaps:
  scale_with_dpi: true
  inner_gap: 8px
  outer_gap:
    top: 4px
    right: 4px
    bottom: 4px
    left: 4px
window_effects:
  focused_window:
    border:
      enabled: true
      color: '#7aa2f7'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: small_rounded
    transparency:
      enabled: true
      opacity: 95%
  other_windows:
    border:
      enabled: true
      color: '#414868'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: small_rounded
    transparency:
      enabled: true
      opacity: 85%
window_behavior:
  initial_state: tiling
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false
workspaces:
- name: '1'
  bind_to_monitor: 0
  keep_alive: true
- name: '2'
  bind_to_monitor: 0
- name: '3'
  bind_to_monitor: 0
- name: '4'
  bind_to_monitor: 0
- name: '5'
  bind_to_monitor: 0
- name: '6'
  bind_to_monitor: 0
- name: '7'
  bind_to_monitor: 0
- name: '8'
  bind_to_monitor: 0
- name: '9'
  bind_to_monitor: 0
- name: '10'
  bind_to_monitor: 1
  keep_alive: true
window_rules:
- commands:
  - ignore
  match:
  - window_process:
      equals: zebar
  - window_process:
      equals: PowerToys
    window_class:
      regex: HwndWrapper\[PowerToys\.PowerAccent.*?\]
  - window_title:
      equals: Command Palette
    window_class:
      equals: WinUIDesktopWin32WindowClass
- commands:
  - set-floating --shown-on-top=true --width 600px --height 338px
  match:
  - window_title:
      regex: (?i)picture.?in.?picture
    window_class:
      regex: Chrome_WidgetWin_1|MozillaDialogClass
- commands:
  - set-floating --centered=true
  match:
  - window_class:
      equals: '#32770'
  - window_process:
      regex: (?i)^(CalculatorApp|Calculator|Taskmgr|ApplicationFrameHost)$
    window_title:
      regex: (?i)calculator|task manager
binding_modes: []
keybindings:
- bindings:
  - lwin+h
  - lwin+left
  commands:
  - focus --direction left
- bindings:
  - lwin+shift+h
  - lwin+shift+left
  commands:
  - move --direction left
- bindings:
  - alt+l
  - lwin+right
