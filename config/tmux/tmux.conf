set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
setw -g mode-keys vi
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm*:RGB'
set -s set-clipboard on
# Fallback appearance until scripts/install-tmux-plugins.sh has run.
set -g status-position top
set -g status-interval 5
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set -g detach-on-destroy off
set -g status-style 'bg=#181825,fg=#cdd6f4'
set -g status-left ''
set -g window-status-separator ' '
setw -g window-status-style 'bg=#181825,fg=#cdd6f4'
setw -g window-status-current-style 'bg=#181825,fg=#cdd6f4'
setw -g window-status-current-format '#[fg=#94e2d5,bg=#181825]#[fg=#11111b,bg=#94e2d5]#I #W#[fg=#94e2d5,bg=#181825]#[default]'
setw -g window-status-format '#[fg=#7f849c,bg=#181825]#[fg=#cdd6f4,bg=#7f849c]#I#[fg=#cdd6f4,bg=#313244] #W#[fg=#313244,bg=#181825]#[default]'
set -g status-right '#[fg=#89b4fa,bg=#181825]#[fg=#11111b,bg=#89b4fa] #[fg=#cdd6f4,bg=#313244] #{b:pane_current_path} #[fg=#313244,bg=#181825] #[fg=#cba6f7,bg=#181825]#[fg=#11111b,bg=#cba6f7]󰃰 #[fg=#cdd6f4,bg=#313244] %H:%M #[fg=#313244,bg=#181825]'
set -g status-right-length 90
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '"${XDG_CONFIG_HOME:-$HOME/.config}/dotfiles-wsl/bin/clipboard-copy"'
bind f new-window '"${XDG_CONFIG_HOME:-$HOME/.config}/dotfiles-wsl/bin/tmux-sessionizer"'
bind r run-shell 'tmux source-file "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux.conf"' \; display-message 'tmux config reloaded'
# Original alternative resize bindings.
bind -r , resize-pane -L 20
bind -r . resize-pane -R 20
bind -r - resize-pane -D 7
bind -r = resize-pane -U 7
bind -r ^ last-window

# Keep downloaded plugins outside the dotfiles Git repository.
set-environment -gF TMUX_PLUGIN_MANAGER_PATH "#{?XDG_DATA_HOME,#{XDG_DATA_HOME},#{HOME}/.local/share}/tmux/plugins/"
# TPM reads these declarations from this file, in order.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'jonmosco/kube-tmux'
# Load the theme before composing modules, then TPM interpolates CPU fields.
run-shell 'if [ -f "${TMUX_PLUGIN_MANAGER_PATH}tmux/catppuccin.tmux" ]; then tmux source-file "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/theme.conf"; fi'
# TPM must be initialized last. Ctrl+B then I installs; Ctrl+B then U updates.
run-shell 'if [ -f "${TMUX_PLUGIN_MANAGER_PATH}tpm/tpm" ]; then "${TMUX_PLUGIN_MANAGER_PATH}tpm/tpm"; fi'
