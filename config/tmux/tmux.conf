set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
setw -g mode-keys vi
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm*:RGB'
set -s set-clipboard on
set -g status-position top
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g status-left '#[fg=#94e2d5] #S '
setw -g window-status-current-style 'bg=#94e2d5,fg=#1e1e2e,bold'
setw -g window-status-current-format ' #I:#W '
set -g status-right '#[fg=#89b4fa] #{b:pane_current_path} | %H:%M '
set -g status-right-length 70
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '"${XDG_CONFIG_HOME:-$HOME/.config}/dotfiles-wsl/bin/clipboard-copy"'
bind f new-window '"${XDG_CONFIG_HOME:-$HOME/.config}/dotfiles-wsl/bin/tmux-sessionizer"'
bind r run-shell 'tmux source-file "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux.conf"' \; display-message 'tmux config reloaded'
